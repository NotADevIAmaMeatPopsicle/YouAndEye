[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "youandeye-host"
version = "0.4.0"
description = "Local emote/1 host bridge for YouandEye expression surfaces"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "mcp>=1.29,<2", "pydantic>=2.12,<3"]

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]

[project.scripts]
youandeye-bridge = "host.youandeye.server:main"
youandeye-heltec = "host.youandeye.heltec_transport:main"
youandeye-mcp = "host.youandeye.mcp_server:main"
youandeye-port-yield = "host.youandeye.port_yield:main"

[tool.hatch.build.targets.wheel]
packages = ["host"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "schema"
"protocol/examples" = "protocol/examples"

[tool.hatch.build.targets.sdist]
include = [
    "/host",
    "/schema",
    "/protocol/examples",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
